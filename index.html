<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Potato Clicker - Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #c9a87c;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(80, 50, 20, 0.08) 0px,
                rgba(80, 50, 20, 0.08) 1px,
                transparent 1px,
                transparent 9px
            );
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3e2a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .menu-wrapper {
            width: 480px;
            background: #e8d5b5;
            border: 12px solid #8b5e3c;
            box-shadow: 
                inset 0 0 0 3px #c49a6c,
                inset 0 0 0 6px #5c3d26,
                0 0 40px rgba(0,0,0,0.4);
            padding: 50px 40px;
            text-align: center;
            position: relative;
        }

        .bakery-name {
            background: #8b5e3c;
            border: 3px solid #c49a6c;
            padding: 8px 25px;
            border-radius: 4px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #f8f0e0;
            box-shadow: 0 3px 0 #5c3d26;
            display: inline-block;
        }

        h1 {
            font-size: 2.6rem;
            margin: 10px 0 8px 0;
            text-shadow: 2px 2px 0 #8b5e3c;
            letter-spacing: 1px;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: normal;
            opacity: 0.85;
            margin-bottom: 35px;
            color: #5c3d26;
        }

        .potato-container {
            position: relative;
            display: inline-block;
            margin: 10px 0 20px 0;
        }

        .potato-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 220, 140, 0.5) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .start-link {
            display: inline-block;
            position: relative;
            z-index: 2;
            text-decoration: none;
        }

        .start-link img {
            width: 190px;
            height: auto;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.35));
            border-radius: 50%;
            transition: transform 0.15s ease;
        }

        .start-link:hover img {
            transform: scale(1.08);
        }

        .start-link:active img {
            transform: scale(0.94);
        }

        .hint {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.7;
            font-style: italic;
            color: #5c3d26;
        }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <div class="bakery-name">Batataria do Papagaio Guloso</div>
        
        <h1>Potato Clicker</h1>
        <h3>Clique na batata para começar</h3>

        <div class="potato-container">
            <div class="potato-glow"></div>
            <a href="game.html" class="start-link">
                <img src="https://naturalterra.vtexassets.com/arquivos/ids/173269/batata-inglesa-unidade.jpg?v=638887886306900000" alt="Iniciar Jogo">
            </a>
        </div>

        <div class="hint">Clique na batata para entrar na loja</div>
    </div>

</body>
</html>
